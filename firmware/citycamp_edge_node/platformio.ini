; City Camp Lagoon Edge-AI manhole node — Seeed Studio XIAO ESP32-S3 + Wio-SX1262
;
;   pio run -t upload            build + flash over USB-C
;   pio device monitor           115200-baud console ([EDGE_TX] frames + commands)
;   python ../../scripts/test_phase5_firmware.py   host-side C++ build + parity tests of edge_core.hpp
;
; Copy include/secrets.example.h -> include/secrets.h for LoRaWAN keys and Wi-Fi demo settings.

[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32@^6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1          ; console + [EDGE_TX] on the USB-C port
    -DFW_VERSION=\"citycamp-edge-1.0.0\"
    ; -DBENCH_DEMO_MODE=1                 ; uncomment for the PVC standpipe classroom demo
lib_deps =
    jgromes/RadioLib@^7.1.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
